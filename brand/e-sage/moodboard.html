<nav><a href="../../index.html">← все</a> <a href="./board.html">брендборд</a> <a href="../d-care/moodboard.html">← пред.</a> <a href="../f-everyman/moodboard.html">след. →</a></nav>
<div class="sw"><i style="background:#27699F"></i><i style="background:#E99A57"></i><i style="background:#F6F8FA"></i></div>
<div class="tools"><button id="zout">−</button><span id="zval">100%</span><button id="zin">+</button>
<button id="fit" aria-pressed="false">Вписать</button><button id="fs">Во весь экран</button></div></header>
<div id="stage"><img id="mb" src="./moodboard.webp?v=1786883369" alt="Мудборд E — «Точное знание»" width="1672" height="941"></div>
<div class="hint">1:1, без растягивания — оригинал 1672×941. Ctrl+колесо или ± меняют масштаб.</div>
<script>
var NAT=1672,img=document.getElementById('mb'),stage=document.getElementById('stage'),
zval=document.getElementById('zval'),fitBtn=document.getElementById('fit'),zoom=1;
function apply(){stage.classList.remove('fit');fitBtn.setAttribute('aria-pressed','false');
img.style.width=Math.round(NAT*zoom)+'px';zval.textContent=Math.round(zoom*100)+'%';}
function setZoom(z){zoom=Math.min(4,Math.max(.1,z));apply();}
document.getElementById('zin').onclick=function(){setZoom(zoom*1.25);};
document.getElementById('zout').onclick=function(){setZoom(zoom/1.25);};
fitBtn.onclick=function(){var on=stage.classList.toggle('fit');fitBtn.setAttribute('aria-pressed',on?'true':'false');
if(on){img.style.width='';zval.textContent='fit';}else apply();};
document.getElementById('fs').onclick=function(){document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();};
stage.addEventListener('wheel',function(e){if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1));},{passive:false});
addEventListener('keydown',function(e){if(e.key==='+'||e.key==='=')setZoom(zoom*1.25);if(e.key==='-')setZoom(zoom/1.25);
if(e.key==='0')setZoom(1);if(e.key==='f')fitBtn.click();});
apply();
</script></body></html>
